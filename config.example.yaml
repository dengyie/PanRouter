# PanRouter 配置示例 —— 复制为 config.yaml 后修改
# 热加载:除 listen 外的变更(限频/画像/域名路由)5 秒内自动生效;
# 代理与重定向白名单在客户端构建时固化,变更需重启。

server:
  listen: 127.0.0.1:6400
  base_url: http://127.0.0.1:6400     # 对外访问地址;若经反代/域名访问,填 https://pan.example.com
  deploy_profile: home                # home=服务跑在家里(与客户端同 LAN) | cloud=服务跑在云主机(直链绑 IP 时自动走中转)
  sign_ttl: 72h                       # /d、/stream 签名有效期(≥ 最长下载时长)
  data_dir: ./data

auth:
  username: admin
  # bcrypt 哈希;示例为 "admin123",上线前必须更换!
  # 生成:htpasswd -bnBC 10 "" '你的密码' | tr -d ':\n'
  # (若填明文密码也可登录,但每次登录会打警告日志,建议尽早改为哈希)
  password_bcrypt: "$2a$10$ZmboqbL3NvvVCXSDUR3ev.EWMUKRFo6OjQObNE3K6b.XggHNyuT9K"
  api_token: change-me-to-random      # 脚本调用令牌;非 loopback 监听时为默认值将拒绝启动
  jwt_secret: change-me-to-random     # 会话签名密钥;同时也是凭据加密主密钥的回落值
  # 凭据加密主密钥建议用独立环境变量 PANROUTER_MASTER_KEY(32+ 位随机串)

# 分享链接域名 → 网盘 ID 路由表(可热改;网盘换域名时改这里)
domain_routes:
  quark:
    - pan.quark.cn
  mangodrive:
    - drive.example.com
  baidu:
    - pan.baidu.com
  lanzou:
    - lanzou.com
    - lanzouw.com
    - lanzoui.com
    - lanzoue.com
    - lanzouf.com
    - lanzoa.com
    - lanzoub.com
    - lanzouc.com
    - lanzoud.com
    - lanzouv.com
    - lanzoux.com
    - lansov.com
    - lanzn.com
    - lanzouu.com

# 每网盘驱动配置(键 = driver ID;新增网盘加一个键即可)
drivers:
  quark:
    enabled: true
    limit_qps: 2                      # 本地限频,防触发风控
    download_concurrency: 3
    redirect_allow: [".quark.cn", ".quarkcdn.cn", ".uc.cn"]  # 中转重定向白名单,只能加严
    proxy: ""                         # 可选:http://user:pass@host:port
  lanzou:
    enabled: true
    limit_qps: 5
    download_concurrency: 3
    redirect_allow: [".lanzouw.com", ".lanzou.com", ".lanzouu.com", ".xlig.cn", ".lanrar.com", ".dmpdmp.com", ".bakstotre.com"]

  # 百度网盘:凭据为浏览器 BDUSS/STOKEN Cookie,多账号池 + 转存硬闸(50 次/天/账号)。
  # 风控最严,pilot 期限频 1 QPS;直链必须带 netdisk UA(由 driver 下发)。
  baidu:
    enabled: true
    limit_qps: 1
    download_concurrency: 2
    # 百度 CDN 会 302 到 .baidupcs.com 等域名,中转/直链按此白名单放行。
    redirect_allow: [".baidu.com", ".baidupcs.com", ".baidupcs.cn", ".bdstatic.com"]

  # 私有云盘(Mango Drive / OpenList 后端):凭据是 OpenList API Token,
  # 在「账号管理」以 pan=mangodrive 添加后即可解析 drive.* 下的目录链接。
  mangodrive:
    enabled: true
    limit_qps: 10
    download_concurrency: 8
    internal_base: http://10.0.0.3:5244      # 内网(EasyTier)直连:绕开 CF 隧道请求体上限
    public_base: https://drive.example.com      # 对外域名:相对 raw_url 的还原基址
    # proxy: socks5://127.0.0.1:11080            # 无 TUN 的节点:经本地 socks5 到内网
    allow_private: true                         # 放行私网/回环;仅私有盘开,默认 false 守 SSRF
    redirect_allow: ["drive.example.com"]

# 云对云转存:把解析出的直链搬进私有盘,不经客户端。
# endpoint 同样建议用内网地址;token 为 OpenList 的 API Token。
transfer:
  endpoint: http://10.0.0.3:5244
  # proxy: socks5://127.0.0.1:11080             # 同上;无 TUN 节点必填
  token: ""
  dest_dir: /pool/panrouter
  max_bytes: 0                        # 0 = 默认 64GiB,负值 = 不限

# 中转流(/stream)调优:deploy_profile: cloud 时直链绑 IP,下载必须走服务端中转,
# 这两个值决定单条上游连接的服务质量。两项都可在运行时热加载(改配置即生效,
# 只影响新请求);0 或不写 = 用括号里的默认值,负值 = 关闭该特性(排障用)。
relay:
  # 单条上游连接最多搬运多少字节就主动重开一条。网盘常对同一条长连接限速
  # (实测 quark 累计约 1 GiB 后掉到 ~100 KB/s),按块换连接是根治手段。
  # (默认 268435456 = 256 MiB;-1 = 不轮换,一条连接跑到底)
  rotate_bytes: 0
  # 上游连续这么久一个字节都不吐就判挂死,取消该连接并尝试 Range 续传。
  # 只在「正阻塞读上游」时计时,客户端自己读得慢不会误杀。Go duration 格式。
  # (默认 60s;-1 = 关闭看门狗)
  stall_timeout: 0
  # 一次「写客户端 / Flush」最多允许阻塞多久。客户端既不收也不关(暂停下载、
  # 杀进程但 TCP 未断开)时,Write 会永远阻塞,上游连接被白白吊住。
  # 每次写都会重设,客户端恢复读即自动解除,不会误杀慢而健康的大文件下载。
  # (默认 120s;-1 = 关闭该保护)
  client_stall_timeout: 0

aria2:
  endpoint: http://127.0.0.1:6800/jsonrpc
  secret: ""                          # aria2.conf 里 rpc-secret 的值
  same_host: true                     # aria2 是否与 PanRouter 同机/同内网(决定绑 IP 直链能否直下)

log:
  level: info
