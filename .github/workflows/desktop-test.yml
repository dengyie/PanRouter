# 桌面端单测流水线:main 推送 / PR / 手动触发时跑 :desktop:test。
#
# 背景:此前桌面端单测只在本机跑,CI 只有打包流水线(pr-portable / release);
# 2026-11-12 起测试也纳入 CI,与「编译/验证必须走 GitHub CI」的口径对齐。
# :desktop:test 是纯 Gradle/JVM 任务(darkmode.dll 的 MSVC 编译只挂在 JavaExec
# 任务上,不拦 test),所以无需 VS 工具链。
# 注:testInProcess 是给中文路径本机用的替代入口(build.gradle.kts),CI 在
# ASCII 路径下走标准 test。

name: Test 桌面端单测

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gradle :desktop:test
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run :desktop:test
        shell: powershell
        run: .\gradlew.bat :desktop:test --console=plain

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-report
          path: desktop/build/reports/tests/test
          retention-days: 7
