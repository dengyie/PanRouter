name: Release 发版

# 目的：推送 v* tag（或手动触发）时构建免安装便携包并发布 GitHub Release。
# 构建流程完全复用 portable-package.ps1，与本地打包 / pr-portable.yml 同一套逻辑。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建便携包并发布 Release
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 构建便携包
        shell: powershell
        run: .\portable-package.ps1

      - name: 打包为 zip
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "v0.0.0-manual$([int]$env:GITHUB_RUN_NUMBER)" }
          $name = "YunX-Desktop-portable-$tag"
          Push-Location .\release
          try {
            & 7z a -tzip -mx=5 "..\$name.zip" "YunX-Desktop" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z 打包失败" }
          } finally {
            Pop-Location
          }
          $mb = [math]::Round((Get-Item "$name.zip").Length / 1MB, 1)
          Write-Host "release asset: $name.zip ($mb MB)"
          "asset=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 发布 Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = $env:asset
          $notes = "YunX-Desktop $tag 便携版（免安装，解压即用）。`n`n基于 [tidain/YunX-Desktop](https://github.com/tidain/YunX-Desktop) 二次开发，新增 PanRouter 服务端解析整合。"
          gh release create $tag $asset --title $tag --notes $notes
