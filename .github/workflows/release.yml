name: Release 发版

# 目的：推送 v* tag（或手动触发）时构建免安装便携包并发布 GitHub Release。
# 构建流程完全复用 portable-package.ps1，与本地打包 / pr-portable.yml 同一套逻辑；
# 打 zip 与发 Release 逻辑在 release-package.ps1（内联 run 块保持纯 ASCII，规避 PS5.1 无 BOM 解析问题）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建便携包并发布 Release
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 构建便携包
        shell: powershell
        run: .\portable-package.ps1

      - name: Package and publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith("v")) { $tag = "v0.0.0-manual$($env:GITHUB_RUN_NUMBER)" }
          .\release-package.ps1 -Tag $tag
